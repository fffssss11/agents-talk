name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python hub.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py --check --allow-unlicensed
      - run: python scripts/audit_public.py --source .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-browser-diagnostics
          path: .runtime/*qa.png
          retention-days: 7
